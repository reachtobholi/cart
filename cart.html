<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping Cart</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><div class="top"><div><div class="brand">Bholi Spices</div><div class="sub">Your shopping cart</div></div><a class="cart" href="index.html">Continue Shopping</a></div><div id="empty" class="empty"><h2>Your cart is empty</h2><p>Add products from the product pages.</p><a class="btn continue" href="index.html">Shop Products</a></div><div id="items"></div><section id="summary" class="summary" style="display:none"><div class="row"><span>Subtotal</span><strong id="subtotal">₹0</strong></div><div class="row"><span>Delivery</span><strong id="delivery">₹0</strong></div><div id="note" class="note"></div><div class="row grand"><span>Total</span><strong id="total">₹0</strong></div><button class="remove" onclick="BholiCart.clearCart()">Clear Cart</button></section><section class="form"><h2>Customer Details</h2><p class="small">Send your complete order directly to Bholi Spices on WhatsApp. Payment and delivery confirmation will be handled on WhatsApp.</p><form id="checkoutForm"><div class="field"><label>Name *</label><input name="name" required></div><div class="field"><label>Mobile Number *</label><input name="mobile" inputmode="tel" required></div><div class="field"><label>Delivery Address *</label><textarea name="address" required></textarea></div><div class="field"><label>Pincode *</label><input name="pincode" inputmode="numeric" pattern="[0-9]{6}" required></div><button class="btn wa full" type="submit">💬 Place Order on WhatsApp</button></form></section></main><script src="cart.js"></script></body></html>
